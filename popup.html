<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot the Pod</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="language.css"></head>
<body>
  <header class="topbar"><div><p class="eyebrow">SPOT THE POD</p><h1>Find your next listen.</h1></div><button id="settings" class="icon-button" aria-label="Open settings" title="Settings">⚙</button></header>
  <main>
    <section id="setup" class="panel hidden" aria-labelledby="setup-title"><h2 id="setup-title">Connect Spotify</h2><p>Connect your account to search Spotify’s podcast catalogue. Your password is never visible to this extension.</p><button id="connect" class="primary">Connect with Spotify</button><button id="configure" class="text-button">Developer setup</button></section>
    <section id="app" class="hidden">
      <div class="location-row"><div><span class="label">SPOTIFY MARKET</span><strong id="market-name">your region</strong></div><div class="location-actions"><select id="market" aria-label="Choose Spotify market"></select><select id="language" aria-label="Filter by language"></select></div></div>
      <form id="search-form" role="search"><input id="search" type="search" autocomplete="off" placeholder="Search podcasts" aria-label="Search podcasts"><button class="primary" type="submit">Search</button></form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="player-section" class="player hidden" aria-labelledby="now-playing"><div class="section-heading"><div><span class="label">NOW PLAYING</span><h2 id="now-playing">Episode</h2></div><button id="close-player" class="icon-button" aria-label="Close player">×</button></div><iframe id="player" title="Spotify podcast player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="eager"></iframe></section>
      <section id="shows-section" aria-labelledby="results-title"><div class="section-heading"><div><span class="label" id="results-kicker">FOR YOUR MARKET</span><h2 id="results-title">Recommended podcasts</h2></div><button id="refresh" class="icon-button" aria-label="Refresh recommendations" title="Refresh">↻</button></div><div id="shows" class="show-grid"></div></section>
      <section id="episodes-section" class="hidden" aria-labelledby="episodes-title"><div class="section-heading"><div><span class="label">LATEST FROM</span><h2 id="episodes-title">Episodes</h2></div><button id="back" class="text-button">Back to shows</button></div><div id="episodes" class="episode-list"></div></section>
    </section>
  </main><script type="module" src="src/popup.js"></script>
</body></html>
